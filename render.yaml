# Render Blueprint: New > Blueprint > pick this repo. Render reads this file.
# The backend is written in C; Render builds it from the Dockerfile.
services:
  - type: web
    name: smart-travel-cost-finder
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OLA_MAPS_API_KEY
        sync: false          # Render asks you to paste the key; it never goes in the repo
      - key: PORT
        value: "10000"
